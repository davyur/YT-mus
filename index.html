<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicApp — веб-версия интерфейса</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
/* ===== KivyMD Dark / BlueGray палитра ===== */
:root{
  --bg:#121212;
  --surface:#1e1e1e;
  --card:#262626;
  --primary:#607d8b;      /* BlueGray */
  --primary-light:#90a4ae;
  --text:rgba(255,255,255,.85);
  --text-dim:rgba(255,255,255,.55);
  --accent:#ff5252;       /* heart active */
  --divider:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',system-ui,Arial,sans-serif}
body{background:#000;display:flex;justify-content:center;min-height:100vh}

/* "Экран телефона" */
#phone{width:100%;max-width:430px;height:100vh;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ===== TopAppBar (MDTopAppBar) ===== */
.appbar{background:var(--primary);color:#fff;height:56px;display:flex;align-items:center;
  padding:0 16px;font-size:20px;font-weight:500;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}

/* ===== Навигация (MDFlatButton как в build_topbar) ===== */
.navbar{display:flex;background:var(--surface);border-bottom:1px solid var(--divider);flex-shrink:0}
.navbar button{flex:1;background:none;border:none;color:var(--primary-light);height:48px;
  font-size:14px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;position:relative;opacity:.85}
.navbar button:hover{background:rgba(255,255,255,.05)}
.navbar button.active{color:#fff;opacity:1}
.navbar button.active::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--primary-light)}

/* ===== Контент экрана ===== */
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.screen{display:none}
.screen.active{display:block}

/* ===== MDTextField (поиск / название) ===== */
.field{margin:12px 16px 4px;position:relative}
.field input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--divider);
  color:var(--text);font-size:16px;padding:14px 2px 8px;outline:none}
.field label{position:absolute;left:2px;top:14px;color:var(--text-dim);font-size:16px;
  pointer-events:none;transition:.2s}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:-4px;font-size:12px;color:var(--primary-light)}
.field input:focus{border-bottom:2px solid var(--primary-light)}

/* ===== Строка трека (TrackRowRV, высота 72dp) ===== */
.track-row{display:flex;align-items:center;height:72px;padding:6px 10px;gap:6px;border-bottom:1px solid var(--divider)}
.cover{width:52px;height:52px;border-radius:8px;background:linear-gradient(135deg,#37474f,#546e7a);
  display:flex;align-items:center;justify-content:center;color:#b0bec5;font-size:26px;flex-shrink:0}
.track-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.track-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:none;color:var(--text-dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn .material-icons{font-size:24px}
.icon-btn.fav-on{color:var(--accent)}
.now-playing .track-title{color:var(--primary-light)}

/* ===== Плейлисты (TwoLineListItem) ===== */
.list-item{padding:14px 16px;border-bottom:1px solid var(--divider);cursor:pointer;display:flex;align-items:center;gap:12px}
.list-item:hover{background:rgba(255,255,255,.04)}
.list-item .li-text{flex:1}
.li-primary{font-size:16px}
.li-secondary{font-size:13px;color:var(--text-dim)}
.row-actions{display:flex;align-items:center;gap:10px;padding:10px 16px}
.row-actions input{flex:1;background:var(--card);border:1px solid var(--divider);border-radius:8px;
  color:var(--text);padding:12px 14px;font-size:15px;outline:none}
.row-actions input:focus{border-color:var(--primary-light)}

/* ===== MDRaisedButton ===== */
.btn-raised{background:var(--primary);color:#fff;border:none;border-radius:4px;height:36px;
  padding:0 16px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;
  box-shadow:0 3px 6px rgba(0,0,0,.4);flex-shrink:0}
.btn-raised:hover{background:#78909c}
.btn-flat{background:none;border:none;color:var(--primary-light);height:36px;padding:0 12px;
  font-size:14px;text-transform:uppercase;cursor:pointer;border-radius:4px}
.btn-flat:hover{background:rgba(144,164,174,.12)}

/* ===== Мини-плеер (MDCard, radius 18, высота ~130) ===== */
.miniplayer{background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -3px 10px rgba(0,0,0,.5);
  padding:8px 12px 6px;flex-shrink:0}
.mp-title{font-size:14px;height:24px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-time{font-size:12px;color:var(--text-dim);text-align:right;height:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary-light) var(--fill,0%),rgba(255,255,255,.15) var(--fill,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--primary-light);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:var(--primary-light);cursor:pointer}
.mp-controls{display:flex;justify-content:center;align-items:center;height:48px}
.mp-controls .icon-btn{width:48px;height:48px}
.mp-controls .icon-btn.play{width:56px;height:56px;background:var(--primary);color:#fff}
.mp-controls .icon-btn.play:hover{background:#78909c}

/* ===== Диалог (MDDialog type=simple) ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.dialog{background:#2c2c2c;border-radius:8px;width:min(320px,90%);box-shadow:0 11px 15px rgba(0,0,0,.4);overflow:hidden}
.dialog h3{padding:18px 24px 10px;font-size:18px;font-weight:500}
.dialog .d-item{padding:14px 24px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:14px}
.dialog .d-item:hover{background:rgba(255,255,255,.06)}
.dialog .d-item .material-icons{font-size:22px;color:var(--text-dim)}
.dialog .d-actions{display:flex;justify-content:flex-end;padding:8px}

/* ===== Тост ===== */
.toast{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#3a3a3a;color:#fff;
  padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;
  box-shadow:0 4px 10px rgba(0,0,0,.5)}
.toast.show{opacity:1}

.empty{padding:48px 16px;text-align:center;color:var(--text-dim)}
.empty .material-icons{font-size:48px;opacity:.4;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div id="phone">

  <!-- Верхняя панель навигации (аналог build_topbar) -->
  <nav class="navbar">
    <button data-screen="library" class="active">Библиотека</button>
    <button data-screen="playlists">Плейлисты</button>
    <button data-screen="favorites">Избранное</button>
    <button data-screen="history">История</button>
  </nav>

  <main>
    <!-- ================= БИБЛИОТЕКА ================= -->
    <section id="screen-library" class="screen active">
      <div class="field">
        <input id="search" type="text" placeholder=" ">
        <label>Поиск...</label>
      </div>
      <div id="library-list"></div>
    </section>

    <!-- ================= ПЛЕЙЛИСТЫ ================= -->
    <section id="screen-playlists" class="screen">
      <div class="row-actions">
        <input id="playlist-name" type="text" placeholder="Название">
        <button class="btn-raised" onclick="createPlaylist()">Создать</button>
      </div>
      <div id="playlists-list"></div>
    </section>

    <!-- ================= ПРОСМОТР ПЛЕЙЛИСТА ================= -->
    <section id="screen-playlist_view" class="screen">
      <div class="appbar" id="pv-title">Плейлист</div>
      <div id="pv-list"></div>
    </section>

    <!-- ================= ИЗБРАННОЕ ================= -->
    <section id="screen-favorites" class="screen">
      <div id="favorites-list"></div>
    </section>

    <!-- ================= ИСТОРИЯ ================= -->
    <section id="screen-history" class="screen">
      <div id="history-list"></div>
    </section>
  </main>

  <!-- ================= МИНИ-ПЛЕЕР (build_miniplayer) ================= -->
  <div class="miniplayer">
    <div class="mp-title" id="now-label">Не играет</div>
    <input type="range" id="progress" min="0" max="100" value="0">
    <div class="mp-time" id="time-label">0:00 / 0:00</div>
    <div class="mp-controls">
      <button class="icon-btn" title="Предыдущий" onclick="prevTrack()"><span class="material-icons">skip_previous</span></button>
      <button class="icon-btn play" id="btn-toggle" title="Play/Pause" onclick="togglePlay()"><span class="material-icons">play_arrow</span></button>
      <button class="icon-btn" title="Следующий" onclick="nextTrack()"><span class="material-icons">skip_next</span></button>
      <button class="icon-btn" title="Стоп" onclick="stopTrack()"><span class="material-icons">stop</span></button>
    </div>
  </div>

  <!-- Диалог "Трек" (MDDialog simple) -->
  <div class="overlay" id="track-dialog">
    <div class="dialog">
      <h3>Трек</h3>
      <div class="d-item" onclick="dialogAction('add')"><span class="material-icons">playlist_add</span>Добавить в плейлист</div>
      <div class="d-item" onclick="dialogAction('fav')"><span class="material-icons" id="dlg-fav-icon">favorite_border</span><span id="dlg-fav-text">В избранное</span></div>
      <div class="d-actions"><button class="btn-flat" onclick="closeDialog()">Закрыть</button></div>
    </div>
  </div>

  <!-- Диалог выбора плейлиста -->
  <div class="overlay" id="pl-dialog">
    <div class="dialog">
      <h3>В плейлист</h3>
      <div id="pl-dialog-items"></div>
      <div class="d-actions"><button class="btn-flat" onclick="hidePlDialog()">Отмена</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ ДАННЫЕ (демо, аналог таблиц SQLite) ============ */
let tracks = [
 {id:1,title:"Bohemian Rhapsody",artist:"Queen",album:"A Night at the Opera",duration:354,favorite:0},
 {id:2,title:"Imagine",artist:"John Lennon",album:"Imagine",duration:187,favorite:1},
 {id:3,title:"Billie Jean",artist:"Michael Jackson",album:"Thriller",duration:294,favorite:0},
 {id:4,title:"Smells Like Teen Spirit",artist:"Nirvana",album:"Nevermind",duration:301,favorite:1},
 {id:5,title:"Hotel California",artist:"Eagles",album:"Hotel California",duration:391,favorite:0},
 {id:6,title:"Yesterday",artist:"The Beatles",album:"Help!",duration:125,favorite:0},
 {id:7,title:"Stairway to Heaven",artist:"Led Zeppelin",album:"Led Zeppelin IV",duration:482,favorite:0},
 {id:8,title:"Wonderwall",artist:"Oasis",album:"(What's the Story) Morning Glory?",duration:258,favorite:0},
];
let playlists = [{id:1,name:"Rock"},{id:2,name:"Вечернее"}];
let playlistTracks = {1:[4,7],2:[2,6]};
let history = [];
let pvId = null;

/* ============ СОСТОЯНИЕ ПЛЕЕРА ============ */
const state = {current:null, playing:false, pos:0, timer:null, queue:[], qIndex:-1};

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byTitle = (a,b)=>a.title.localeCompare(b.title,"ru",{sensitivity:"base"});

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800);
}

/* ============ НАВИГАЦИЯ (аналог ScreenManager.goto) ============ */
document.querySelectorAll(".navbar button").forEach(b=>{
  b.onclick=()=>goto(b.dataset.screen);
});
function goto(name){
  document.querySelectorAll(".navbar button").forEach(x=>x.classList.toggle("active",x.dataset.screen===name));
  showScreen(name);
  renderAll();
}
function showScreen(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-"+name).classList.add("active");
}

/* ============ СТРОКА ТРЕКА (аналог TrackRowRV) ============ */
function trackRow(t){
  const div=document.createElement("div");
  div.className="track-row"+(state.current&&state.current.id===t.id?" now-playing":"");
  div.innerHTML=`
    <div class="cover"><span class="material-icons">music_note</span></div>
    <div class="track-col">
      <div class="track-title">${esc(t.title)}</div>
      <div class="track-sub">${esc(t.artist)} • ${esc(t.album)}</div>
    </div>
    <button class="icon-btn fav ${t.favorite?"fav-on":""}" title="В избранное">
      <span class="material-icons">${t.favorite?"favorite":"favorite_border"}</span></button>
    <button class="icon-btn playbtn" title="Играть"><span class="material-icons">play_arrow</span></button>
    <button class="icon-btn morebtn" title="Ещё"><span class="material-icons">more_vert</span></button>`;
  div.querySelector(".fav").onclick=()=>toggleFav(t.id);
  div.querySelector(".playbtn").onclick=()=>playTrack(t);
  div.querySelector(".morebtn").onclick=()=>openDialog(t);
  return div;
}

/* ============ БИБЛИОТЕКА + ПОИСК (search_tracks) ============ */
$("search").addEventListener("input",renderLibrary);
function filtered(){
  const q=$("search").value.trim().toLowerCase();
  if(!q)return tracks;
  if(q==="favorites"||q==="избранное")return tracks.filter(t=>t.favorite);
  return tracks.filter(t=>(t.title+" "+t.artist+" "+t.album).toLowerCase().includes(q));
}
function renderLibrary(){
  const el=$("library-list"); el.innerHTML="";
  const list=[...filtered()].sort(byTitle);
  if(!list.length){el.innerHTML=`<div class="empty"><span class="material-icons">search_off</span>Ничего не найдено</div>`;return;}
  list.forEach(t=>el.appendChild(trackRow(t)));
}

/* ============ ИЗБРАННОЕ (toggle_favorite) ============ */
function toggleFav(id){
  const t=tracks.find(x=>x.id===id); if(!t)return;
  t.favorite=t.favorite?0:1;
  if(t.favorite)logPlayHistory(id,true);
  renderAll(); toast(t.favorite?"Добавлено в избранное":"Убрано из избранного");
}
function renderFavorites(){
  const el=$("favorites-list"); el.innerHTML="";
  const favs=tracks.filter(t=>t.favorite).sort(byTitle);
  if(!favs.length){el.innerHTML=`<div class="empty"><span class="material-icons">favorite_border</span>Пока пусто. Нажмите ♥ на треке</div>`;return;}
  favs.forEach(t=>el.appendChild(trackRow(t)));
}

/* ============ ИСТОРИЯ (play_history) ============ */
let hid=1;
function logPlayHistory(id,favOnly){
  history.unshift({id,t:new Date(),fav:!!favOnly});
  if(history.length>50)history.pop();
}
function renderHistory(){
  const el=$("history-list"); el.innerHTML="";
  if(!history.length){el.innerHTML=`<div class="empty"><span class="material-icons">history</span>История пуста</div>`;return;}
  history.forEach(h=>{
    const t=tracks.find(x=>x.id===h.id); if(!t)return;
    const row=document.createElement("div"); row.className="list-item";
    row.innerHTML=`<span class="material-icons" style="color:var(--text-dim)">${h.fav?"favorite":"play_circle_outline"}</span>
      <div class="li-text"><div class="li-primary">${esc(t.title)}</div>
      <div class="li-secondary">${h.t.toLocaleTimeString("ru-RU")} • ${esc(t.artist)}</div></div>`;
    row.onclick=()=>playTrack(t);
    el.appendChild(row);
  });
}

/* ============ ПЛЕЙЛИСТЫ ============ */
function createPlaylist(){
  const inp=$("playlist-name"); const name=inp.value.trim();
  if(!name)return toast("Введите название");
  if(playlists.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast("Такой плейлист уже есть");
  const id=Math.max(0,...playlists.map(p=>p.id))+1;
  playlists.push({id,name}); playlistTracks[id]=[];
  inp.value=""; renderAll(); toast("Плейлист создан");
}
function renderPlaylists(){
  const el=$("playlists-list"); el.innerHTML="";
  const sorted=[...playlists].sort(byTitleName);
  if(!sorted.length){el.innerHTML=`<div class="empty"><span class="material-icons">queue_music</span>Создайте первый плейлист</div>`;return;}
  sorted.forEach(p=>{
    const n=(playlistTracks[p.id]||[]).length;
    const row=document.createElement("div"); row.className="list-item";
    row.innerHTML=`<span class="material-icons" style="color:var(--primary-light)">queue_music</span>
      <div class="li-text"><div class="li-primary">${esc(p.name)}</div>
      <div class="li-secondary">${n} трек${plural(n)} • Открыть</div></div>
      <button class="icon-btn del" title="Удалить"><span class="material-icons" style="font-size:20px">delete_outline</span></button>`;
    row.onclick=()=>openPlaylist(p.id,p.name);
    row.querySelector(".del").onclick=e=>{e.stopPropagation();deletePlaylist(p.id,p.name);};
    el.appendChild(row);
  });
}
const byTitleName=(a,b)=>a.name.localeCompare(b.name,"ru",{sensitivity:"base"});
function plural(n){const m=n%10,k=n%100;if(m===1&&k!==11)return"";if(m>=2&&m<=4&&(k<12||k>14))return"а";return"ов";}
function deletePlaylist(id,name){
  if(!confirm(`Удалить плейлист «${name}»?`))return;
  playlists=playlists.filter(p=>p.id!==id); delete playlistTracks[id];
  renderAll(); toast("Плейлист удалён");
}
function openPlaylist(id,name){
  pvId=id; $("pv-title").textContent=name;
  showScreen("playlist_view");
  renderPlaylistView();
}
function renderPlaylistView(){
  const el=$("pv-list"); el.innerHTML="";
  if(pvId===null)return;
  const ids=playlistTracks[pvId]||[];
  const items=ids.map(tid=>tracks.find(t=>t.id===tid)).filter(Boolean).sort(byTitle);
  if(!items.length){el.innerHTML=`<div class="empty"><span class="material-icons">music_off</span>В плейлисте нет треков.<br>Нажмите ⋮ на треке в библиотеке → «Добавить в плейлист»</div>`;return;}
  items.forEach(t=>{
    const row=document.createElement("div"); row.className="track-row";
    row.innerHTML=`<div class="track-col"><div class="track-title">${esc(t.title)}</div>
      <div class="track-sub">${esc(t.artist)} • ${fmt(t.duration)}</div></div>
      <button class="icon-btn playbtn" title="Играть"><span class="material-icons">play_arrow</span></button>
      <button class="icon-btn rembtn" title="Убрать"><span class="material-icons">remove_circle_outline</span></button>`;
    row.querySelector(".playbtn").onclick=()=>playTrack(t);
    row.querySelector(".rembtn").onclick=()=>{
      playlistTracks[pvId]=(playlistTracks[pvId]||[]).filter(x=>x!==t.id);
      renderAll(); toast("Трек убран из плейлиста");
    };
    el.appendChild(row);
  });
}

/* ============ ДИАЛОГ ТРЕКА (MDDialog) ============ */
let dlgTrack=null;
function openDialog(t){
  dlgTrack=t;
  $("dlg-fav-icon").textContent=t.favorite?"favorite":"favorite_border";
  $("dlg-fav-text").textContent=t.favorite?"Убрать из избранного":"В избранное";
  $("track-dialog").classList.add("open");
}
function closeDialog(){$("track-dialog").classList.remove("open");}
function dialogAction(kind){
  closeDialog();
  if(!dlgTrack)return;
  if(kind==="fav")toggleFav(dlgTrack.id);
  else openPlDialog(dlgTrack);
}
function openPlDialog(t){
  const el=$("pl-dialog-items"); el.innerHTML="";
  if(!playlists.length)el.innerHTML=`<div class="d-item" style="color:var(--text-dim)">Нет плейлистов — создайте их во вкладке «Плейлисты»</div>`;
  playlists.forEach(p=>{
    const d=document.createElement("div"); d.className="d-item";
    d.innerHTML=`<span class="material-icons">queue_music</span>${esc(p.name)}`;
    d.onclick=()=>{
      playlistTracks[p.id]=playlistTracks[p.id]||[];
      if(!playlistTracks[p.id].includes(t.id)){playlistTracks[p.id].push(t.id);toast(`«${t.title}» → ${p.name}`);}
      else toast("Уже в плейлисте");
      hidePlDialog(); renderAll();
    };
    el.appendChild(d);
  });
  $("pl-dialog").classList.add("open");
}
function hidePlDialog(){$("pl-dialog").classList.remove("open");}
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("open");}));

/* ============ ВОСПРОИЗВЕДЕНИЕ (эмуляция службы/SoundLoader) ============ */
function playTrack(t){
  state.current=t; state.pos=0; state.playing=true;
  logPlayHistory(t.id);
  state.queue=[...filtered()].sort(byTitle);
  state.qIndex=state.queue.findIndex(x=>x.id===t.id);
  $("now-label").textContent=`${t.title} — ${t.artist}`;
  $("progress").max=t.duration;
  setToggleIcon(); startTicker(); updateProgressUI(); renderAll();
  toast("▶ Играет (в APK — через фоновую службу Android)");
}
function setToggleIcon(){
  $("btn-toggle").querySelector(".material-icons").textContent=state.playing?"pause":"play_arrow";
}
function togglePlay(){
  if(!state.current)return toast("Сначала выберите трек");
  state.playing=!state.playing; setToggleIcon();
  state.playing?startTicker():stopTicker();
}
function stopTrack(){
  state.playing=false; state.current=null; state.pos=0; stopTicker();
  $("now-label").textContent="Не играет"; $("time-label").textContent="0:00 / 0:00";
  $("progress").value=0; setProgressFill(); setToggleIcon(); renderAll();
}
function nextTrack(){if(state.queue.length)playTrack(state.queue[(state.qIndex+1)%state.queue.length]);}
function prevTrack(){if(state.queue.length)playTrack(state.queue[(state.qIndex-1+state.queue.length)%state.queue.length]);}
function startTicker(){
  stopTicker();
  state.timer=setInterval(()=>{
    if(!state.playing||!state.current)return;
    state.pos++;
    if(state.pos>=state.current.duration){nextTrack();return;}
    updateProgressUI();
  },1000);
}
function stopTicker(){clearInterval(state.timer);state.timer=null;}
$("progress").addEventListener("input",e=>{
  if(!state.current)return;
  state.pos=+e.target.value; updateProgressUI();   // перемотка (on_seek)
});
function updateProgressUI(){
  $("progress").value=state.pos;
  $("time-label").textContent=`${fmt(state.pos)} / ${fmt(state.current?state.current.duration:0)}`;
  setProgressFill();
}
function setProgressFill(){
  const p=$("progress"), pct=p.max?(p.value/p.max*100):0;
  p.style.setProperty("--fill",pct+"%");
}

/* ============ ОБЩИЙ РЕНДЕР (refresh_all) ============ */
function renderAll(){
  renderLibrary(); renderFavorites(); renderPlaylists(); renderHistory();
  if($("screen-playlist_view").classList.contains("active"))renderPlaylistView();
}
renderAll();
</script>
</body>
</html>
