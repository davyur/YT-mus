name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config \
            cmake ninja-build build-essential \
            openjdk-17-jdk-headless \
            zip unzip \
            libssl-dev libffi-dev zlib1g-dev \
            git patch wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.33"

      - name: Fix buildozer.spec
        run: |
          python3 << 'PYEOF'
          import re

          with open('buildozer.spec', 'r') as f:
              content = f.read()

          # Фиксируем версии Python и убираем дубликаты
          def fix_requirements(m):
              items = [x.strip() for x in m.group(1).split(',')]
              items = [x for x in items if x not in ('python3', 'hostpython3') and not x.startswith('python3=') and not x.startswith('hostpython3=')]
              remove = {'sdl2', 'sdl2_ttf', 'sdl2_image', 'sdl2_mixer', 'sqlite3', 'android'}
              items = [x for x in items if x not in remove and x]
              items = ['hostpython3==3.11.9', 'python3==3.11.9'] + items
              return 'requirements = ' + ','.join(items)

          content = re.sub(r'^requirements\s*=\s*(.+)$', fix_requirements, content, flags=re.MULTILINE)
          content = re.sub(r'^android\.arch\s*=.*', 'android.archs = arm64-v8a', content, flags=re.MULTILINE)
          if 'android.archs' not in content:
              content = content.replace('[app]', '[app]\nandroid.archs = arm64-v8a', 1)
          if 'android.sdk_build_tools' not in content:
              content = content.replace('android.ndk = 25b', 'android.ndk = 25b\nandroid.sdk_build_tools = 33.0.2')
          content = content.replace('warn_on_root = 1', 'warn_on_root = 0')
          content = re.sub(r'^log_level\s*=.*', 'log_level = 2', content, flags=re.MULTILINE)

          with open('buildozer.spec', 'w') as f:
              f.write(content)

          print("✅ buildozer.spec обновлён!")
          for line in content.splitlines():
              if line.startswith('requirements') or line.startswith('android.arch'):
                  print(line)
          PYEOF

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show full log on failure
        if: failure()
        run: |
          echo "=== ПОСЛЕДНИЕ 500 СТРОК ЛОГА ==="
          tail -n 500 build.log || tail -n 500 ~/.buildozer/android/platform/build-arm64-v8a/build/logs/*.log 2>/dev/null || true
          echo ""
          echo "=== ПОИСК ОШИБОК ==="
          grep -i "error\|failed\|exception" build.log | tail -n 50 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musicapp-apk
          path: bin/*.apk
          retention-days: 30
